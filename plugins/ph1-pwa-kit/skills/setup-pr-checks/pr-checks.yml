# PR checks (ph1-pwa-kit): runs on every pull request and on pushes to the main branch.
# Results show in the PR as ticks or crosses next to the merge button.
name: PR checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan the new commits for keys and passwords
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then RANGE="-1"; fi
          fi
          ./gitleaks git --redact --verbose --log-opts="$RANGE"

  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # SETUP: match the project (.nvmrc, engines, or the version the team uses)
          cache: npm # SETUP: npm, pnpm or yarn; remove if there is no lock file
      # SETUP (pnpm only): add `- uses: pnpm/action-setup@v4` before setup-node.
      - name: Install
        run: npm ci # SETUP: pnpm install --frozen-lockfile / yarn install --frozen-lockfile
      - name: Lint
        run: npm run lint --if-present
      - name: Type check
        run: npm run typecheck --if-present # SETUP: or `npx tsc --noEmit` if there is a tsconfig.json and no typecheck script
      - name: Unit and API tests
        run: npm test --if-present
        env:
          CI: 'true'
      - name: Build
        run: npm run build --if-present
        # SETUP: if the build needs environment variables, list them here with harmless placeholder values,
        # or take them from repository secrets: ${{ secrets.NAME }}. Never write real keys in this file.
        # env:
        #   VITE_SUPABASE_URL: https://example.supabase.co

      # ---- Lean code: warnings only (never fail the PR). Results go to the run's summary page. ----
      - name: Unused files, exports and packages (knip)
        continue-on-error: true
        run: |
          echo "## Unused code (knip)" >> "$GITHUB_STEP_SUMMARY"
          npx --yes knip@5 --no-exit-code --reporter markdown >> "$GITHUB_STEP_SUMMARY" || echo "knip could not run" >> "$GITHUB_STEP_SUMMARY"
      - name: Copy-pasted code (jscpd)
        continue-on-error: true
        run: |
          npx --yes jscpd@4 src --min-lines 10 --min-tokens 70 --silent --reporters markdown --output .jscpd \
            --ignore "**/node_modules/**,**/dist/**,**/build/**,**/*.test.*,**/*.spec.*" || true
          echo "## Copy-pasted code (jscpd)" >> "$GITHUB_STEP_SUMMARY"
          cat .jscpd/jscpd-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No duplication report." >> "$GITHUB_STEP_SUMMARY"
        # SETUP: replace `src` with the project's source folder(s).
      - name: Bundle size
        continue-on-error: true
        env:
          OUT_DIR: dist # SETUP: the build output folder (dist, build, .next/static, out)
          BUDGET_KB: 350 # SETUP: total gzipped JavaScript budget; start at today's size plus about 10%
        run: |
          if [ ! -d "$OUT_DIR" ]; then echo "No $OUT_DIR folder: skipped." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "## Bundle size (gzipped JavaScript)" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | KB |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in $(find "$OUT_DIR" -name '*.js' -type f); do
            echo "$(gzip -c "$f" | wc -c) $f"
          done | sort -rn | head -10 | while read S F; do echo "| ${F#$OUT_DIR/} | $((S / 1024)) |" >> "$GITHUB_STEP_SUMMARY"; done
          TOTAL=$(find "$OUT_DIR" -name '*.js' -type f -exec sh -c 'gzip -c "$1" | wc -c' _ {} \; | awk '{s+=$1} END {print int(s/1024)}')
          echo "**Total: ${TOTAL} KB** (budget ${BUDGET_KB} KB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt "$BUDGET_KB" ]; then echo "::warning title=Bundle size::JavaScript is ${TOTAL} KB gzipped, over the ${BUDGET_KB} KB budget"; fi
      # SETUP (optional, static builds only - e.g. a Vite PWA with a dist folder): Lighthouse performance and PWA score.
      # - name: Lighthouse
      #   continue-on-error: true
      #   run: npx --yes @lhci/cli@0.14.0 autorun --collect.staticDistDir=dist --upload.target=filesystem --upload.outputDir=.lighthouse
      #   (keeps the report private to the run; never use temporary-public-storage for a private app)

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # SETUP: same as above
      - name: Known security holes in packages (high and critical)
        run: npm audit --omit=dev --audit-level=high # SETUP: pnpm audit --prod --audit-level high / yarn npm audit
