# PR checks (ph1-pwa-kit): runs on every pull request and on pushes to the main branch.
# Results show in the PR as ticks or crosses next to the merge button.
name: PR checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan the new commits for keys and passwords
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then RANGE="-1"; fi
          fi
          ./gitleaks git --redact --verbose --log-opts="$RANGE"

  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # SETUP: match the project (.nvmrc, engines, or the version the team uses)
          cache: npm # SETUP: npm, pnpm or yarn; remove if there is no lock file
      # SETUP (pnpm only): add `- uses: pnpm/action-setup@v4` before setup-node.
      - name: Install
        run: npm ci # SETUP: pnpm install --frozen-lockfile / yarn install --frozen-lockfile
      - name: Lint
        run: npm run lint --if-present
      - name: Type check
        run: npm run typecheck --if-present # SETUP: or `npx tsc --noEmit` if there is a tsconfig.json and no typecheck script
      - name: Unit and API tests
        run: npm test --if-present
        env:
          CI: 'true'
      - name: Build
        run: npm run build --if-present
        # SETUP: if the build needs environment variables, list them here with harmless placeholder values,
        # or take them from repository secrets: ${{ secrets.NAME }}. Never write real keys in this file.
        # env:
        #   VITE_SUPABASE_URL: https://example.supabase.co

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # SETUP: same as above
      - name: Known security holes in packages (high and critical)
        run: npm audit --omit=dev --audit-level=high # SETUP: pnpm audit --prod --audit-level high / yarn npm audit
